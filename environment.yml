name: sds320
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Geospatial core (GDAL/PROJ come with rasterio/geopandas from conda-forge)
  - gdal
  - rasterio
  - geopandas
  - shapely
  - affine

  # Deep learning / building detection (installs PyTorch as a dependency)
  - geoai              # conda-forge name; on PyPI it is "geoai-py"

  # Data handling and analysis
  - numpy
  - pandas
  - scipy

  # Model evaluation
  - lazyslide          # segmentation metrics (precision, recall, F1, IoU, PQ)

  # Visualisation and interactive maps
  - matplotlib
  - leafmap
  - ipyleaflet         # backend for leafmap.leafmap (interactive split maps)
  - localtileserver    # needed by leafmap for add_raster()
  - ipywidgets

  # Notebook
  - jupyterlab
  - ipykernel